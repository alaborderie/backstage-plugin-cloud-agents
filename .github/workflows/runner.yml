name: runner

on:
  pull_request:
    paths:
      - runner/**
      - .github/workflows/runner.yml
  push:
    branches: [main]
    paths:
      - runner/**
      - .github/workflows/runner.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: runner/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/alaborderie/cloud-agent-runner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: version
        run: echo "value=$(jq -r .version runner/package.json)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: runner
          load: true
          tags: cloud-agent-runner:ci
          build-args: CLOUD_AGENT_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          test "$(docker run --rm cloud-agent-runner:ci version)" = "${{ steps.version.outputs.value }}"
          docker run --rm cloud-agent-runner:ci sh -c 'claude --version && codex --version && opencode --version && gh --version && id -u' | tee versions.txt
          test "$(tail -1 versions.txt)" = 10001
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-agent-runner:ci "$IMAGE:latest"
          docker tag cloud-agent-runner:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
