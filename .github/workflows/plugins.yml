name: plugins

on:
  pull_request:
    paths:
      - plugins/**
      - docs/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - tsconfig.json
      - runner/schema/**
      - runner/test/streams/**
      - .github/workflows/plugins.yml
  push:
    branches: [main]
    paths:
      - plugins/**
      - docs/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - tsconfig.json
      - runner/schema/**
      - runner/test/streams/**
      - .github/workflows/plugins.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn lint
      - run: yarn prettier:check
      # The backend tests run on SQLite and on Postgres 16, which testcontainers starts in Docker.
      - run: yarn test
      - run: yarn build
      - name: Pack the published packages
        run: yarn workspaces foreach --all --no-private pack --dry-run

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NPM_TOKEN == ''
        run: echo "No NPM_TOKEN repository secret, so the packages are not published."
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: env.NPM_TOKEN != ''
        run: corepack enable
      - if: env.NPM_TOKEN != ''
        run: yarn install --immutable
      - if: env.NPM_TOKEN != ''
        run: yarn tsc && yarn build
      # Publishes each package whose version is not on npm yet; bump versions to release.
      - if: env.NPM_TOKEN != ''
        env:
          YARN_NPM_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: yarn workspaces foreach --all --no-private --topological npm publish --access public --tolerate-republish
